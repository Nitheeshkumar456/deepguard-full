name: Publish Release APK

on:
  workflow_dispatch:

jobs:
  publish:
    name: Package and Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Release
        run: |
          echo "Packaging DeepGuard AI Release..."
          python -m pip install pandas openpyxl
          python scripts/generate_excel_test_reports.py
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepGuard-Release-Package
          path: reports/excel/

