name: Complete CI/CD Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-validate:
    name: Test Backend, Web & Model Regressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl numpy scikit-learn fastapi uvicorn requests

      - name: Run Model Regression & API Unit Tests
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py" || true

      - name: Run Test Suites & Generate Reports
        run: |
          python scripts/generate_excel_test_reports.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Application
        run: |
          cd web
          npm ci || npm install
          npm run build

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CI-CD-Test-Reports
          path: reports/
          retention-days: 30
