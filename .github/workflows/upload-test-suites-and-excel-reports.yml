name: Upload All Test Suites and Excel Reports

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-upload-reports:
    name: Generate & Upload All Test Suites and Excel Reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'
        continue-on-error: true

      - name: Install Report Generation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Execute Comprehensive Test Suites & Generate Excel Reports
        run: |
          python scripts/generate_excel_test_reports.py

      - name: Verify Generated Excel & CSV Files
        run: |
          ls -la reports/
          ls -la reports/excel/

      - name: Upload All Test Suites and Excel Reports (Zip Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: All-Test-Suites-Excel-Reports
          path: |
            reports/excel/DeepGuard_All_Test_Suites_Results.xlsx
            reports/excel/DeepGuard_Baseline_Load_Test_Results.xlsx
            reports/excel/DeepGuard_Image_Test_Suite_200.xlsx
            reports/excel/DeepGuard_Video_Test_Suite_200.xlsx
            reports/excel/DeepGuard_Audio_Test_Suite_200.xlsx
            reports/excel/DeepGuard_API_Security_Test_Suite_50.xlsx
            reports/excel/DeepGuard_Web_Android_Parity_Test_Suite_50.xlsx
            reports/excel/*.csv
            reports/*.md
          retention-days: 90
          if-no-files-found: error

      - name: Upload Master Excel Workbook Separately
        uses: actions/upload-artifact@v4
        with:
          name: DeepGuard-Master-Excel-Workbook
          path: reports/excel/DeepGuard_All_Test_Suites_Results.xlsx
          retention-days: 90

      - name: Upload Baseline Load Test Excel Report Separately
        uses: actions/upload-artifact@v4
        with:
          name: DeepGuard-Baseline-Load-Test-Excel
          path: reports/excel/DeepGuard_Baseline_Load_Test_Results.xlsx
          retention-days: 90

      - name: Upload Selenium Frontend Login E2E Excel Report Separately
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Frontend-Login-E2E-Excel
          path: reports/excel/Selenium_Frontend_Login_E2E_Test_Results.xlsx
          retention-days: 90

      - name: Upload Appium Frontend Login E2E Excel Report Separately
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Frontend-Login-E2E-Excel
          path: reports/excel/Appium_Frontend_Login_E2E_Test_Results.xlsx
          retention-days: 90

