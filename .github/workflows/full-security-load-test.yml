name: Full Security & Load Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-suite:
    runs-on: ubuntu-latest
    env:
      BACKEND_TECH: ''
      API_URL: ''   # set this in the workflow dispatch if you want DAST/Load test against a live API
    steps:
      # ---------- Checkout & Python ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------- Detect backend technology ----------
      - name: Detect backend technology
        id: detect
        run: |
          bash scripts/detect_tech.sh
        # The script sets BACKEND_TECH and writes it to $GITHUB_OUTPUT
        # Example: echo "backend_tech=python" >> $GITHUB_OUTPUT

      # ---------- Extract API endpoints (optional) ----------
      - name: Extract API Endpoints (auto)
        id: extract_endpoints
        run: |
          python scripts/extract_endpoints.py
        # Expected output: reports/endpoint_inventory.json

      # ---------- Install security tools ----------
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Install Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y trivy

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks-linux-amd64 -o gitleaks
          chmod +x gitleaks

      - name: Install OWASP Dependency‑Check (if applicable)
        if: ${{ env.BACKEND_TECH == 'java' || env.BACKEND_TECH == 'dotnet' }}
        run: |
          wget -q https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip
          unzip -q dependency-check-9.0.9-release.zip -d dependency-check

      # ---------- Run security scans ----------
      - name: Run Semgrep SAST Scan
        run: |
          semgrep --config=auto --json -o reports/semgrep.json .

      - name: Run Trivy Vulnerability Scan
        run: |
          trivy fs --format json -o reports/trivy.json .

      - name: Run Gitleaks Secret Scan
        run: |
          ./gitleaks detect --source . --report-format json --report-path reports/gitleaks.json

      - name: Run OWASP Dependency‑Check
        if: ${{ env.BACKEND_TECH == 'java' || env.BACKEND_TECH == 'dotnet' }}
        run: |
          ./dependency-check/bin/dependency-check.sh --project "${{ github.repository }}" --scan . --format JSON --out reports/dependency-check.json

      # ---------- Optional DAST (live API) ----------
      - name: Optional DAST Scan (if API_URL provided)
        if: env.API_URL != ''
        run: |
          sudo apt-get update -y && sudo apt-get install -y zaproxy
          zap-baseline.py -t ${{ env.API_URL }} -r reports/dast-report.html

      # ---------- Load testing with k6 ----------
      - name: Install k6 (load testing tool)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y k6

      - name: Run baseline load test (100 VUs, 1 min)
        env:
          API_URL: ${{ env.API_URL }}
        run: |
          # Output JSON results for later conversion
          k6 run -e API_URL=${{ env.API_URL }} -o json=reports/k6_results.json scripts/load_test.k6.js

      - name: Convert k6 JSON results to Excel report
        run: |
          python scripts/k6_to_excel.py

      # ---------- Generate consolidated security reports (Excel) ----------
      - name: Install report generator dependencies
        run: |
          pip install pandas openpyxl markdown

      - name: Generate Security & Findings Excel report
        run: |
          python scripts/generate_reports.py

      # ---------- Upload all Excel reports as artifacts ----------
      - name: Upload test reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-test-reports
          path: |
            reports/*.xlsx
            reports/*.html
            reports/*.txt
            reports/*.json

      # ---------- Summary in GitHub UI ----------
      - name: Add summary to workflow
        run: |
          echo "## Security & Load Test Summary" >> $GITHUB_STEP_SUMMARY
          cat reports/executive-summary.md >> $GITHUB_STEP_SUMMARY

      # ---------- Fail on critical findings ----------
      - name: Fail on Critical vulnerabilities
        run: |
          python - <<'PY'
          import json, glob, sys
          critical = False
          for path in glob.glob('reports/*.json'):
              try:
                  data = json.load(open(path))
              except Exception:
                  continue
              items = []
              if isinstance(data, list):
                  items = data
              elif isinstance(data, dict):
                  if 'results' in data:
                      items = data['results']
                  elif 'vulnerabilities' in data:
                      items = data['vulnerabilities']
              for item in items:
                  sev = item.get('severity') or item.get('Severity')
                  if sev and sev.upper() == 'CRITICAL':
                      critical = True
                      break
              if critical:
                  break
          if critical:
              print('Critical vulnerabilities found. Failing the workflow.')
              sys.exit(1)
          else:
              print('No critical vulnerabilities detected.')
          PY
