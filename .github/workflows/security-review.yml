name: Security Review

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security-assessment:
    name: Security Assessment & SAST Audit
    runs-on: ubuntu-latest
    env:
      BACKEND_TECH: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect backend technology
        id: detect
        run: |
          bash scripts/detect_tech.sh

      - name: Extract API Endpoints
        id: extract_endpoints
        run: |
          python scripts/extract_endpoints.py

      - name: Install Analysis Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl markdown semgrep || true

      - name: Run Semgrep SAST Scan
        run: |
          mkdir -p reports
          semgrep --config=auto --json -o reports/semgrep.json . || echo '{"results": []}' > reports/semgrep.json
        continue-on-error: true

      - name: Run Secret Leak Detection Audit
        run: |
          mkdir -p reports
          python -c '
          import os, json, re
          findings = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in [".git", "node_modules", "dist", ".venv", "__pycache__"]]
              for file in files:
                  if file.endswith((".py", ".js", ".ts", ".tsx", ".json", ".md")):
                      p = os.path.join(root, file)
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                              if re.search(r"(?:api[_-]?key|secret|password)\s*[:=]\s*[\"'\'][A-Za-z0-9_\-]{24,}[\"'\']", content, re.I):
                                  findings.append({"File": p, "Description": "Potential secret pattern", "Severity": "HIGH"})
                      except Exception:
                          pass
          with open("reports/gitleaks.json", "w") as f:
              json.dump(findings, f, indent=2)
          print(f"Secret scan completed. Found {len(findings)} potential flags.")
          '

      - name: Generate Consolidated Security Reports
        run: |
          python scripts/generate_reports.py

      - name: Upload Security Reports as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            reports/*.xlsx
            reports/*.md
            reports/*.json
            reports/excel/
          retention-days: 30

      - name: Add Executive Summary to Workflow
        if: always()
        run: |
          if [ -f reports/executive-summary.md ]; then
            cat reports/executive-summary.md >> $GITHUB_STEP_SUMMARY
          fi
          echo "### Security Review Completed Successfully" >> $GITHUB_STEP_SUMMARY
