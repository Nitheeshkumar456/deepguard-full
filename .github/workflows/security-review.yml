name: Security Review

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-assessment:
    runs-on: ubuntu-latest
    env:
      BACKEND_TECH: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect backend technology
        id: detect
        run: |
          bash scripts/detect_tech.sh
        # The script should set BACKEND_TECH env var and also output to $GITHUB_OUTPUT
        # Example: echo "backend_tech=python" >> $GITHUB_OUTPUT

      - name: Extract API Endpoints (auto)
        id: extract_endpoints
        run: |
          python scripts/extract_endpoints.py
        # This creates reports/endpoint_inventory.json used later

      - name: Optional DAST Scan (if API_URL provided)
        if: env.API_URL != ''
        run: |
          sudo apt-get update -y && sudo apt-get install -y zaproxy
          zap-baseline.py -t ${{ env.API_URL }} -r reports/dast-report.html

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep SAST Scan
        run: |
          semgrep --config=auto --json -o reports/semgrep.json .

      - name: Install Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y trivy

      - name: Run Trivy Vulnerability Scan
        run: |
          trivy fs --format json -o reports/trivy.json .

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks-linux-amd64 -o gitleaks
          chmod +x gitleaks

      - name: Run Gitleaks Secret Scan
        run: |
          ./gitleaks detect --source . --report-format json --report-path reports/gitleaks.json

      - name: Install OWASP Dependency-Check (if applicable)
        if: ${{ env.BACKEND_TECH == 'java' || env.BACKEND_TECH == 'dotnet' }}
        run: |
          wget -q https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip
          unzip -q dependency-check-9.0.9-release.zip -d dependency-check

      - name: Run OWASP Dependency-Check
        if: ${{ env.BACKEND_TECH == 'java' || env.BACKEND_TECH == 'dotnet' }}
        run: |
          ./dependency-check/bin/dependency-check.sh --project "${{ github.repository }}" --scan . --format JSON --out reports/dependency-check.json

      - name: Install report generator dependencies
        run: |
          pip install pandas openpyxl markdown

      - name: Generate Security Reports
        run: |
          python scripts/generate_reports.py

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/*

      - name: Add summary to workflow
        run: |
          echo "## Security Review Summary" >> $GITHUB_STEP_SUMMARY
          cat reports/executive-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Fail on Critical vulnerabilities
        run: |
          python - <<'PY'
          import json, glob, sys
          critical = False
          for path in glob.glob('reports/*.json'):
              try:
                  data = json.load(open(path))
              except Exception:
                  continue
              items = []
              if isinstance(data, list):
                  items = data
              elif isinstance(data, dict):
                  if 'results' in data:
                      items = data['results']
                  elif 'vulnerabilities' in data:
                      items = data['vulnerabilities']
              for item in items:
                  sev = item.get('severity') or item.get('Severity')
                  if sev and sev.upper() == 'CRITICAL':
                      critical = True
                      break
              if critical:
                  break
          if critical:
              print('Critical vulnerabilities found. Failing the workflow.')
              sys.exit(1)
          else:
              print('No critical vulnerabilities detected.')
          PY
