version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/uploads

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    env_file:
      - .env.example
    depends_on:
      - backend
    ports:
      - "8500:8500"
    restart: unless-stopped
    volumes:
      - ./ai/models:/app/models

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    env_file:
      - .env.example
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pg_data:
